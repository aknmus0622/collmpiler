lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      '@aac/cli':
        specifier: workspace:*
        version: link:packages/cli
      '@aac/core':
        specifier: workspace:*
        version: link:packages/core

  examples/checkout-ts:
    devDependencies:
      '@aac/cli':
        specifier: workspace:*
        version: link:../../packages/cli

  packages/cli:
    dependencies:
      '@aac/core':
        specifier: workspace:*
        version: link:../core
      fast-check:
        specifier: ^4.10.2
        version: 4.10.2

  packages/core: {}

packages:

  fast-check@4.10.2:
    resolution: {integrity: sha512-iK2f+YrcmoeGqk6fA0ea2bptcu/itMIm4NfEozq6N25+aG6h7s5HZbB/k1aV7b5w5sFLMCbbtRUsTVR+BgC3xw==}
    engines: {node: '>=12.17.0'}

  pure-rand@8.4.2:
    resolution: {integrity: sha512-vvuOGgcuPJAirlHvuQw1TrOiw7ptaIXXmIbNuiNOY6lNGJJH49PQ1Kj4nd783nPdQhQdicgOjVI2yI/9BD6/Ng==}

snapshots:

  fast-check@4.10.2:
    dependencies:
      pure-rand: 8.4.2

  pure-rand@8.4.2: {}
